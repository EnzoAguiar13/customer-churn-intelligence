[build-system]
requires = ["setuptools>=75,<76", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-intelligence"
version = "0.1.0"
description = "A portfolio-grade foundation for customer churn intelligence and applied ML operations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Enzo Aguiar" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
cci-data-download = "customer_intelligence.data.download:main"
cci-data-quality = "customer_intelligence.data.quality_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
